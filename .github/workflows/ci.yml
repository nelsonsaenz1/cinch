name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing here needs the
# older run's result, and the bundle step is slow enough to be worth it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `experiments.typedRoutes` turns every `href` into a union of the routes
      # that actually exist, but the file that declares them —
      # .expo/types/router.d.ts — is generated, gitignored, and absent on a
      # fresh checkout. tsconfig.json includes it, so with no file the include
      # matches nothing, `Href` falls back to `string`, and this job typechecks
      # every route reference against nothing at all: `router.push('/nope')`
      # passes CI. Expo's typed-routes reference names this exact command for
      # "type checking on a Continuous Integration (CI) server", as the
      # no-dev-server way to produce the same types `npx expo start` writes.
      #
      # It only ever writes the generated file here; tsconfig.json is already
      # configured, so the command leaves it untouched.
      #
      # Invoked directly rather than through an npm script, and that is load
      # bearing: package.json is an `@expo/fingerprint` input, so adding a
      # one-line script to it moves the native runtime hash every shipped
      # binary is keyed to and turns the next release from an OTA into a Store
      # build. fingerprint-gate.test.ts names this exact reflex — "adding an
      # npm script for a dev helper" — and failed on the commit that did it.
      # A workflow file is not a fingerprint input, so this convenience costs
      # nothing.
      - name: Generate route types
        run: npx expo customize tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      # Failing, not advisory. A lint step that is allowed to be red is a lint
      # step nobody reads, and `react-hooks/set-state-in-effect` in particular
      # catches a class of cascading-render bug that typecheck cannot see.
      - name: Lint
        run: npm run lint

      # The unit suite is pure logic — the styling engine, the colour maths,
      # cost-per-wear, date keys. No renderer, no native mocks: `node --test`
      # over esbuild bundles, which is why it runs in seconds.
      - name: Unit tests
        run: npm test

      # The styling engine is the core IP and is pure, deterministic arithmetic
      # over a fixed fixture closet — so it is exactly the thing that can break
      # silently. A colour-harmony regression produces outfits that are merely
      # a bit worse, which no crash and no type error will ever catch.
      - name: Styling engine smoke test
        run: npm run smoke:styling

      # Catches the failure typecheck cannot: a module that resolves at compile
      # time but blows up when Metro actually bundles it for the device.
      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/export

  # Row level security is the only thing standing between one user's closet and
  # everyone else's, and it is invisible to every other job here: it lives in
  # the database, not in the app, so a broken policy typechecks, bundles and
  # ships. pgTAP against a real local Postgres with the real migrations applied
  # is the only way to actually observe it.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # v3, not v1: v1 runs on the deprecated Node 20 action runtime. This is a
      # major bump of someone else's action, so it is the one step here whose
      # green run has to be observed rather than assumed from the diff.
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Starts Postgres with every migration in supabase/migrations applied,
      # then runs supabase/tests/*.sql under pg_prove. No remote project and no
      # secrets are involved — this is entirely local to the runner.
      - name: Start local Supabase
        run: supabase db start

      - name: RLS and storage policy tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Edge Functions are excluded from tsconfig.json — they run on Deno, with
      # different globals and different module resolution — so this is the only
      # thing that typechecks them at all.
      #
      # Copied out of the repo first, which is the whole trick.
      #
      # Deno walks up from the file being checked, finds the Expo app's root
      # package.json, and concludes the whole repo is a Node project. It then
      # either demands a node_modules directory or — with --node-modules-dir=auto
      # — tries to install react-native, tailwind and every other app dependency
      # just to typecheck a Deno function. Moving the tree somewhere with no
      # package.json above it removes the ambiguity at the source, and leaves the
      # committed deno.json exactly matching what Supabase actually deploys.
      - name: Typecheck Edge Functions
        run: |
          # --node-modules-dir=none forces resolution from Deno's own global
          # cache. Without it a cold runner insists on a node_modules directory
          # that this job has no reason to create, since nothing here is a Node
          # project — and it is what Supabase's Edge Runtime does anyway.
          cp -R supabase/functions "$RUNNER_TEMP/fn-check"
          for fn in "$RUNNER_TEMP"/fn-check/*/index.ts; do
            echo "checking $(basename "$(dirname "$fn")")"
            deno check --allow-import --node-modules-dir=none "$fn"
          done
